<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案目錄</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --card-hover: #1f2430;
    --border: #2a2f3a;
    --text: #e3e6ec;
    --muted: #8b93a3;
    --accent: #6cb6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 16px 64px;
  }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .lead { margin: 0 0 32px; color: var(--muted); }
  h2 {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 32px 0 12px;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.doc {
    display: block;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  a.doc:hover, a.doc:focus-visible {
    background: var(--card-hover);
    border-color: var(--accent);
    outline: none;
  }
  .comment { display: none !important; }
  .title { display: block; font-weight: 600; color: var(--accent); }
  .desc { display: block; margin-top: 4px; font-size: 0.92rem; color: var(--muted); }
  footer { margin-top: 48px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>

</main>
</body>
</html>
