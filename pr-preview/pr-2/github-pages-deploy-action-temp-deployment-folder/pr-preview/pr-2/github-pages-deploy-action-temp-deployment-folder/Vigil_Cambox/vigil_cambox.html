<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigil Cambox</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --card-hover: #1f2430;
    --border: #2a2f3a;
    --text: #e3e6ec;
    --muted: #8b93a3;
    --accent: #6cb6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 16px 64px;
  }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .lead { margin: 0 0 32px; color: var(--muted); }
  h2 {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 32px 0 12px;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.doc {
    display: block;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  a.doc:hover, a.doc:focus-visible {
    background: var(--card-hover);
    border-color: var(--accent);
    outline: none;
  }
  .comment { display: none !important; }
  .title { display: block; font-weight: 600; color: var(--accent); }
  .desc { display: block; margin-top: 4px; font-size: 0.92rem; color: var(--muted); }
  footer { margin-top: 48px; font-size: 0.8rem; color: var(--muted); }
  a.back {
    display: inline-block;
    margin-bottom: 24px;
    font-size: 0.9rem;
    color: var(--muted);
    text-decoration: none;
  }
  a.back:hover, a.back:focus-visible { color: var(--accent); outline: none; }
  .empty {
    padding: 24px 20px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <a class="back" href="../index.html">← 回首頁</a>
  <h1>Vigil Cambox</h1>
  <p class="lead comment">Vigil Cambox 專案的整理文件。</p>

  <p class="empty">尚無文件</p>

  <footer class="comment">新增第一份文件時：把上面的「尚無文件」換成分類 &lt;h2&gt; + &lt;ul&gt;（寫法同 FPGA_Board/fpga_board.html），並把首頁卡片的說明改掉。</footer>
</main>
</body>
</html>
